<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activo, afiliado)" class="sidebar">
    <div class="sb-brand">
        <svg class="shield-icon" viewBox="0 0 40 40" fill="none">
            <path d="M20 3L34 8V19C34 27.5 28 33.8 20 37C12 33.8 6 27.5 6 19V8L20 3Z" fill="#1B6FD1" opacity="0.3"/>
            <path d="M20 3L34 8V19C34 27.5 28 33.8 20 37C12 33.8 6 27.5 6 19V8L20 3Z" stroke="#7FB4F2" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M20 13.5V26.5M13.5 20H26.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <span>Seguro Digital</span>
    </div>

    <div class="sb-user">
        <div class="sb-avatar" th:text="${afiliado != null ? #strings.substring(afiliado.nombre,0,1) : '?'}">M</div>
        <div>
            <div class="sb-user-name" th:text="${afiliado != null ? afiliado.nombre : 'Afiliado'}">María Ramírez</div>
            <div class="sb-user-role" th:text="${afiliado != null and afiliado.plan != null ? afiliado.plan.nombre : 'Sin plan asignado'}">Plan Familiar Plus</div>
        </div>
    </div>

    <nav class="sb-nav">
        <a th:classappend="${activo == 'inicio'} ? 'active'" class="sb-link" th:href="@{/dashboard}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l8-8 8 8M6 10v10h12V10"/></svg>Inicio
        </a>
        <a th:classappend="${activo == 'citas'} ? 'active'" class="sb-link" th:href="@{/citas}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h2M8 17h2"/></svg>Mis citas
        </a>
        <a th:classappend="${activo == 'centros'} ? 'active'" class="sb-link" th:href="@{/centros}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-5-7-11a7 7 0 0114 0c0 6-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Centros médicos
        </a>
        <a th:classappend="${activo == 'reembolsos'} ? 'active'" class="sb-link" th:href="@{/reembolsos}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M17 6.5c0-1.9-2.2-3.5-5-3.5S7 4.6 7 6.5 9.2 9 12 9s5 1.5 5 3.5-2.2 3.5-5 3.5-5-1.5-5-3.5"/></svg>Reembolsos
        </a>
    </nav>

    <div class="sb-bottom">
        <form th:action="@{/logout}" method="post">
    <button type="submit">Cerrar sesión</button>
</form>
    </div>
</aside>

</body>
</html>
